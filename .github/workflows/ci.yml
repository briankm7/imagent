name: CI

on:
  push:
  pull_request:

# Un push nuevo cancela la ejecucion anterior de la misma rama: no tiene sentido
# gastar minutos en verificar un commit que ya esta superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Se instala SOLO el paquete base mas las herramientas de desarrollo.
      # Los extras `gemini` y `qdrant` se quedan fuera a proposito: sin esos
      # SDK instalados, el CI no puede salir a la red aunque quisiera. El
      # requisito de "testeable sin claves y sin base de datos" deja de ser una
      # intencion y pasa a ser una imposibilidad fisica.
      - name: Instalar
        run: pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (formato)
        run: ruff format --check .

      - name: pytest
        run: pytest --cov --cov-report=term-missing

      # Comprobacion explicita de lo de arriba: si alguien mueve google-genai o
      # qdrant-client a las dependencias base, esto lo caza.
      - name: Verificar que no hay SDK de red instalados
        run: |
          ! pip show google-genai > /dev/null 2>&1 || (echo "google-genai no deberia estar en CI" && exit 1)
          ! pip show qdrant-client > /dev/null 2>&1 || (echo "qdrant-client no deberia estar en CI" && exit 1)

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # La imagen se construye en cada push pero no se publica: sirve para que
      # un Dockerfile roto se detecte aqui y no en el despliegue.
      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: imagent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Arrancar la imagen y comprobar /health
        run: |
          docker run -d --name imagent -p 8000:8000 imagent:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | grep '"status":"ok"'
          docker rm -f imagent
